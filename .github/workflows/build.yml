
name: Android 16 Native Build

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git curl python3 unzip zip bc \
            bison flex gperf build-essential \
            ccache libssl-dev libxml2-utils \
            xsltproc rsync

      - name: Install repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -L https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Verify environment
        run: |
          echo "Target: Samsung Galaxy J7 Prime SM-G610F"
          echo "Codename: on7xelte"
          echo "Build type: Native"
          echo "GSI: NO"
          echo "DSU: NO"
          git --version
          python3 --version
          repo --version
